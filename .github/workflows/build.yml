name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with this version (for example v1.0.0). Leave empty for a plain build."
        required: false
        default: ""

# Least privilege: jobs can only read the repository unless they say otherwise.
permissions:
  contents: read

# Third-party actions are pinned to full commit hashes (tag in the comment).
jobs:
  macos:
    name: macOS (AU, VST3, Standalone)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Configure
        run: cmake -S . -B build -G Xcode -DMODULEUR_COPY_AFTER_BUILD=OFF

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Sign (ad hoc)
        run: |
          ART=build/ShmoerghModuleur_artefacts/Release
          codesign --force --deep --sign - "$ART/AU/Moduleur.component"
          codesign --force --deep --sign - "$ART/VST3/Moduleur.vst3"
          codesign --force --deep --sign - "$ART/Standalone/Moduleur.app"

      - name: Validate Audio Unit
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/ShmoerghModuleur_artefacts/Release/AU/Moduleur.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aumu Mdlr Shmo

      - name: Package
        run: |
          ART=build/ShmoerghModuleur_artefacts/Release
          mkdir -p dist
          ditto -c -k --keepParent "$ART/AU/Moduleur.component" dist/Moduleur-AU-macOS.zip
          ditto -c -k --keepParent "$ART/VST3/Moduleur.vst3" dist/Moduleur-VST3-macOS.zip
          ditto -c -k --keepParent "$ART/Standalone/Moduleur.app" dist/Moduleur-Standalone-macOS.zip
          cd dist && shasum -a 256 *.zip > SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Moduleur-macOS
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux (VST3, Standalone, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev libgl-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Publishes a GitHub Release with the macOS downloads. Runs for version tags
  # (v1.2.3) or a manual run of this workflow with a release version.
  release:
    name: Publish release
    needs: [macos, linux]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Check version
        id: version
        env:
          # Passed through the environment, never pasted into the script.
          VERSION: ${{ inputs.release || github.ref_name }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release version must look like v1.2.3, got: $VERSION" >&2
            exit 1
          fi
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Moduleur-macOS
          path: dist

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Moduleur ${{ steps.version.outputs.tag }}
          body_path: .github/release-notes.md
          files: dist/*
